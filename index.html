<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>楓景拾光畢業祝福答錄機</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .phone-booth {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 320px;
            text-align: center;
        }
        h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5rem;
            letter-spacing: 1px;
        }
        .screen {
            background-color: #222;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            font-size: 24px;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: right;
            min-height: 35px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
        .status {
            font-size: 16px;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
            min-height: 24px;
            background-color: #eef2f7;
            padding: 8px;
            border-radius: 6px;
            line-height: 1.4;
        }
        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        button {
            background-color: #f0f0f0;
            border: none;
            padding: 20px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.1s ease;
            color: #444;
        }
        button:active {
            background-color: #ddd;
            transform: scale(0.95);
        }
        button.action-btn {
            background-color: #e74c3c;
            color: white;
        }
        button.action-btn:active {
            background-color: #c0392b;
        }
        button.call-btn {
            background-color: #2ecc71;
            color: white;
        }
        button.call-btn:active {
            background-color: #27ae60;
        }
    </style>
</head>
<body>

<div class="phone-booth">
    <h2>楓景拾光畢業祝福答錄機 🍁</h2>
    <div class="screen" id="display"></div>
    <div class="status" id="statusMessage">請輸入座號 (01-57) 後按撥出</div>

    <div class="keypad">
        <button onclick="press('1')">1</button>
        <button onclick="press('2')">2</button>
        <button onclick="press('3')">3</button>
        <button onclick="press('4')">4</button>
        <button onclick="press('5')">5</button>
        <button onclick="press('6')">6</button>
        <button onclick="press('7')">7</button>
        <button onclick="press('8')">8</button>
        <button onclick="press('9')">9</button>
        <button class="action-btn" onclick="clearClear()">重設</button>
        <button onclick="press('0')">0</button>
        <button class="call-btn" onclick="makeCall()">撥出</button>
    </div>

    <audio id="audioPlayer"></audio>
</div>

<script>
    const studentList = {
        "01": "馮樂恩", "02": "張珈嘉", "03": "黃宇唯", "06": "杜京霏", "07": "劉玥頤",
        "08": "高信信", "09": "賴于媗", "10": "王元謙", "11": "王宥勻", "12": "劉祐潔",
        "13": "陳奕廷", "14": "潘長歆恬", "15": "邱亮衡", "16": "翁晨菡", "17": "蔡秉辰",
        "18": "劉柔妤", "19": "劉宇捷", "20": "陳宇樂", "21": "林梓祈", "22": "陳珊妏",
        "23": "周謙樂", "25": "廖宥銘", "26": "洪睿遠", "27": "楊予實", "28": "林嚞",
        "29": "鄭亞桑", "30": "王日霖", "31": "傅唯翔", "32": "王晴羚", "33": "洪語謙",
        "34": "張愷勻", "35": "陳慶甯", "36": "林仝", "37": "陳芊嵐", "38": "傅昊文",
        "39": "郭奕辰", "40": "陳筠霏", "41": "陳薇方", "42": "王晨昕", "43": "湯晴亦",
        "44": "林廷叡", "45": "李夏澄", "46": "戴妘芯", "47": "黃琳軒", "48": "方昱蘅",
        "50": "詹牧學", "51": "楊環羽", "52": "劉裕宸", "53": "潘羿彤", "54": "謝濟謙",
        "55": "謝忻桐", "56": "蘇柏宇", "57": "李櫂言"
    };

    let inputNumber = "";
    const display = document.getElementById("display");
    const statusMessage = document.getElementById("statusMessage");
    const audioPlayer = document.getElementById("audioPlayer");

    function press(num) {
        if (inputNumber.length < 2) { 
            inputNumber += num;
            display.innerText = inputNumber;
        }
    }

    // 清除與停止播放
    function clearClear() {
        inputNumber = "";
        display.innerText = "";
        statusMessage.innerText = "請輸入座號 (01-57) 後按撥出";
        audioPlayer.pause();
        audioPlayer.src = ""; 
    }

    function makeCall() {
        if (inputNumber === "") {
            statusMessage.innerText = "請先輸入號碼！";
            return;
        }

        let formattedNumber = inputNumber;
        if (inputNumber.length === 1) {
            formattedNumber = "0" + inputNumber;
        }

        const studentName = studentList[formattedNumber];

        if (studentName) {
            statusMessage.innerText = `🎵 正在播放：${formattedNumber}號 ${studentName}`;
            
            // 💡 直接讀取網站根目錄下的 audio 資料夾
            audioPlayer.src = `audio/${formattedNumber}.mp3`;
            
            audioPlayer.play().catch(error => {
                console.log(error);
                statusMessage.innerText = `❌ 播放失敗，請確認 GitHub 上的 audio 資料夾內是否有 ${formattedNumber}.mp3 檔案`;
            });
        } else {
            statusMessage.innerText = `⚠️ 號碼 ${formattedNumber} 是空號喔！`;
        }
    }
</script>

</body>
</html>
